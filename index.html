<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ========================= -->
<!--  PAGE 1 — LOGIN SCREEN    -->
<!-- ========================= -->
<div id="loginScreen" class="full-screen">
  <div class="login-box glass">
    <h2>ورود به حساب</h2>

    <div class="input-field">
      <input id="loginUser" type="text" placeholder="نام کاربری">
    </div>

    <div class="input-field pass-field">
      <input id="loginPass" type="password" placeholder="رمز عبور">
      <span id="togglePass" class="eye">👁️</span>
    </div>

    <button id="loginBtn" class="btn disabled">
      <span class="btn-text">ورود</span>
      <span class="loader"></span>
    </button>
  </div>
</div>


<!-- ============================== -->
<!--  PAGE 2 — VERIFICATION SCREEN -->
<!-- ============================== -->
<div id="verifyScreen" class="full-screen hidden">
  <div class="verify-box glass">
    <h2>کد تأیید ۶ رقمی</h2>

    <div class="code-container">
      <input class="code" maxlength="1">
      <input class="code" maxlength="1">
      <input class="code" maxlength="1">
      <input class="code" maxlength="1">
      <input class="code" maxlength="1">
      <input class="code" maxlength="1">
    </div>

    <div id="timerBox" class="timer">00:60</div>
    <div id="resendCode" class="resend hidden">ارسال مجدد کد</div>

    <button id="verifyBtn" class="btn disabled">
      <span class="btn-text">تایید</span>
      <span class="loader"></span>
    </button>
  </div>
</div>


<!-- =============================== -->
<!--  PAGE 3 — WALLET MAIN SCREEN   -->
<!-- =============================== -->
<div id="walletScreen" class="hidden">

  <!-- iOS NOTIFICATION -->
  <div id="notify" class="notify">پیام</div>

  <!-- HEADER -->
  <div class="header">
    <div>کیف پول من</div>
    <div style="display:flex; gap:10px;">
      <div class="dark-toggle" id="themeBtn">🌓</div>
    </div>
  </div>

  <!-- BALANCE -->
  <div class="balance">
    <div class="amount" id="balanceVal">$0.0509</div>
    <small>آدرس: UQB...Jx0d</small>
  </div>

  <!-- VISA CARD -->
  <div class="visa-card glass">
    <div class="visa-logo">VISA</div>
    <div class="card-number">4023 •••• •••• 1290</div>
    <div class="card-info">
      <div>انقضا: 08/27</div>
      <div>صاحب کارت: YOU</div>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="actions">
    <div class="action-btn" id="sendBtn"><i>⬆</i><span>ارسال</span></div>
    <div class="action-btn" id="receiveBtn"><i>⬇</i><span>دریافت</span></div>
    <div class="action-btn"><i>📷</i><span>اسکن</span></div>
  </div>

  <!-- WALLET ITEMS -->
  <div class="wallet-box glass">
    <div class="asset"><div>TON</div><div>0</div></div>
    <div class="asset"><div>USDT</div><div>0</div></div>
    <div class="asset"><div>HMSTR</div><div>188.17</div></div>
  </div>

  <!-- NAVBAR -->
  <div class="navbar glass">

    <div class="nav-pair left">
      <div class="nav-item"><div class="nav-icon">🏠</div><p>خانه</p></div>
      <div class="nav-item"><div class="nav-icon">📜</div><p>تاریخچه</p></div>
    </div>

    <div class="nav-center">💠</div>

    <div class="nav-pair right">
      <div class="nav-item"><div class="nav-icon">🌐</div><p>مرورگر</p></div>
      <div class="nav-item"><div class="nav-icon">🎁</div><p>کلکسیون</p></div>
    </div>
  </div>


  <!-- SEND SHEET -->
  <div class="sheet" id="sendSheet">
    <h3>ارسال وجه</h3>

    <div class="field"><input id="send_card" placeholder="شماره کارت"></div>
    <div class="field"><input id="send_amount" placeholder="مقدار پول"></div>
    <div class="field"><input id="send_pass" type="password" placeholder="رمز"></div>

    <div class="sheet-actions">
      <div class="btn disabled" id="sendCheck">بررسی</div>
      <div class="btn" id="sendBack">برگشت</div>
    </div>

    <div class="info-box" id="sendInfo"></div>
  </div>


  <!-- RECEIVE SHEET -->
  <div class="sheet" id="receiveSheet">
    <h3>دریافت وجه</h3>

    <div class="field"><input id="receive_pass" type="password" placeholder="رمز مخفی"></div>

    <div class="sheet-actions">
      <div class="btn disabled" id="receiveCheck">بررسی</div>
      <div class="btn" id="receiveBack">برگشت</div>
    </div>
  </div>

</div>

<!-- JS -->
<script src="app.js"></script>

</body>
</html>
